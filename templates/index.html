<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // TACTICAL TRADING COPILOT</title>
    <!-- Fuentes Futuristas Stark HUD -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040914;
            --panel-bg: rgba(8, 20, 38, 0.75);
            --cyan-glow: #00f3ff;
            --blue-glow: #0066ff;
            --gold-glow: #ffb700;
            --red-glow: #ff2a5f;
            --border-glow: rgba(0, 243, 255, 0.35);
            --font-hud: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 102, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #d1f4ff;
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER HUD */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(4, 12, 24, 0.85);
            border-bottom: 1px solid var(--border-glow);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .brand-title {
            font-family: var(--font-hud);
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--cyan-glow);
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--cyan-glow);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hud-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hud-input, .hud-select {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--cyan-glow);
            font-family: var(--font-code);
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
            transition: 0.3s;
        }

        .hud-input:focus, .hud-select:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .btn-stream {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(0, 102, 255, 0.3));
            border: 1px solid var(--cyan-glow);
            color: #ffffff;
            font-family: var(--font-hud);
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-stream:hover {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        /* MAIN CONTAINER */
        .main-container {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }

        /* LEFT: CHAT & DIAGNOSTICS */
        .chat-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 3px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            align-self: flex-end;
            background: rgba(0, 102, 255, 0.25);
            border: 1px solid rgba(0, 102, 255, 0.6);
            color: #e0f4ff;
            border-top-right-radius: 0;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.2);
        }

        .msg-jarvis {
            align-self: flex-start;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid var(--border-glow);
            color: #ffffff;
            border-top-left-radius: 0;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .msg-header {
            font-family: var(--font-hud);
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .msg-user .msg-header { color: #80c4ff; }
        .msg-jarvis .msg-header { color: var(--cyan-glow); }

        /* RIGHT: SCREEN PREVIEW HUD */
        .hud-side-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .preview-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-title {
            font-family: var(--font-hud);
            font-size: 0.75rem;
            color: var(--cyan-glow);
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            width: 100%;
            text-align: left;
        }

        video#screen-preview {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px;
            background: #000;
        }

        /* ARC REACTOR CENTER CONTROL */
        .control-footer {
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgba(2, 6, 14, 0.9);
            border-top: 1px solid var(--border-glow);
            backdrop-filter: blur(15px);
        }

        .arc-reactor-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .arc-reactor {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,243,255,0.8) 0%, rgba(0,102,255,0.4) 60%, rgba(0,0,0,0.9) 100%);
            border: 3px solid var(--cyan-glow);
            box-shadow: 0 0 25px var(--cyan-glow), inset 0 0 15px var(--cyan-glow);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .arc-reactor::before {
            content: '';
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px dashed var(--cyan-glow);
            animation: spin 12s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .arc-reactor.active {
            background: radial-gradient(circle, rgba(255,42,95,0.9) 0%, rgba(255,183,0,0.5) 60%, rgba(0,0,0,0.9) 100%);
            border-color: var(--red-glow);
            box-shadow: 0 0 45px var(--red-glow), inset 0 0 25px var(--red-glow);
            transform: scale(1.08);
        }

        .arc-reactor.active::before {
            border-color: var(--red-glow);
            animation-duration: 4s;
        }

        .arc-icon {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            filter: drop-shadow(0 0 5px var(--cyan-glow));
        }

        .arc-status {
            font-family: var(--font-hud);
            font-size: 0.75rem;
            color: var(--cyan-glow);
            letter-spacing: 2px;
            margin-top: 12px;
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="brand-title">
            <div class="status-dot"></div>
            J.A.R.V.I.S. <span style="font-size: 0.8rem; opacity: 0.7;">// COPILOT</span>
        </div>

        <div class="hud-controls">
            <input type="password" id="access-key" class="hud-input" placeholder="CLAVE DE ACCESO" autocomplete="off">
            
            <select id="model-select" class="hud-select">
                <option value="flash">MODELO: GEMINI 3.6 FLASH (RÁPIDO)</option>
                <option value="pro">MODELO: GEMINI 3.6 PRO (PROFUNDO)</option>
            </select>

            <button id="btn-bind-screen" class="btn-stream">🖥️ VINCULAR PANTALLA</button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="main-container">
        <!-- CHAT PANEL -->
        <div class="chat-panel">
            <div id="chat-messages" class="chat-messages">
                <div class="msg msg-jarvis">
                    <div class="msg-header">SYSTEM // ONLINE</div>
                    Sistemas listos, Señor. Presione "Vincular Pantalla" para seleccionar NinjaTrader/DeepCharts y mantenga presionado el Reactor central para hablar y analizar la subasta.
                </div>
            </div>
        </div>

        <!-- SIDE PANEL -->
        <div class="hud-side-panel">
            <div class="preview-box">
                <div class="preview-title">📡 FEED PANTALLA EN VIVO</div>
                <video id="screen-preview" autoplay playsinline muted></video>
            </div>
        </div>
    </div>

    <!-- ARC REACTOR PUSH TO TALK FOOTER -->
    <div class="control-footer">
        <div class="arc-reactor-wrapper">
            <div id="arc-btn" class="arc-reactor">
                <svg class="arc-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
            <div id="arc-status" class="arc-status">MANTÉN PRESIONADO PARA HABLAR</div>
        </div>
    </div>

    <!-- CANVAS OCULTO PARA CAPTURA -->
    <canvas id="capture-canvas"></canvas>

    <script>
        const accessKeyInput = document.getElementById('access-key');
        const modelSelect = document.getElementById('model-select');
        const btnBindScreen = document.getElementById('btn-bind-screen');
        const screenPreview = document.getElementById('screen-preview');
        const arcBtn = document.getElementById('arc-btn');
        const arcStatus = document.getElementById('arc-status');
        const chatMessages = document.getElementById('chat-messages');
        const captureCanvas = document.getElementById('capture-canvas');

        let screenStream = null;
        let recognition = null;
        let spokenTranscript = "";
        let isListening = false;

        // Cargar clave guardada previamente
        accessKeyInput.value = localStorage.getItem('jarvis_key') || '';
        accessKeyInput.addEventListener('input', () => {
            localStorage.setItem('jarvis_key', accessKeyInput.value);
        });

        // Configuración de Reconocimiento de Voz Web
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                spokenTranscript = transcript;
            };
        }

        // Vincular Captura de Pantalla
        btnBindScreen.addEventListener('click', async () => {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });
                screenPreview.srcObject = screenStream;
                btnBindScreen.innerText = "✓ PANTALLA VINCULADA";
                btnBindScreen.style.borderColor = "var(--cyan-glow)";
            } catch (err) {
                console.error("Error al vincular pantalla:", err);
                alert("No se pudo compartir la pantalla.");
            }
        });

        // Eventos de Presionar y Soltar (Mouse & Touch)
        const startListening = (e) => {
            e.preventDefault();
            if (isListening) return;
            isListening = true;
            spokenTranscript = "";

            arcBtn.classList.add('active');
            arcStatus.innerText = "ESCUCHANDO & ANALIZANDO...";
            arcStatus.style.color = "var(--red-glow)";

            if (recognition) {
                try { recognition.start(); } catch(e){}
            }
        };

        const stopListeningAndSend = async (e) => {
            e.preventDefault();
            if (!isListening) return;
            isListening = false;

            arcBtn.classList.remove('active');
            arcStatus.innerText = "PROCESANDO SUBASTA...";
            arcStatus.style.color = "var(--gold-glow)";

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            // Capturar la imagen actual de la pantalla
            let imageBlob = null;
            if (screenStream && screenStream.active) {
                const videoTrack = screenStream.getVideoTracks()[0];
                const imageCapture = new ImageCapture(videoTrack);
                try {
                    const bitmap = await imageCapture.grabFrame();
                    captureCanvas.width = bitmap.width;
                    captureCanvas.height = bitmap.height;
                    const ctx = captureCanvas.getContext('2d');
                    ctx.drawImage(bitmap, 0, 0, bitmap.width, bitmap.height);

                    imageBlob = await new Promise(resolve => captureCanvas.toBlob(resolve, 'image/jpeg', 0.85));
                } catch(err) {
                    console.log("Fallback canvas capture", err);
                }
            }

            const promptText = spokenTranscript.trim() || "Analice el estado del mercado en esta captura de pantalla.";
            addMessage('user', promptText);

            // Enviar petición al Backend
            await sendToJarvis(promptText, imageBlob);

            arcStatus.innerText = "MANTÉN PRESIONADO PARA HABLAR";
            arcStatus.style.color = "var(--cyan-glow)";
        };

        arcBtn.addEventListener('mousedown', startListening);
        arcBtn.addEventListener('mouseup', stopListeningAndSend);
        arcBtn.addEventListener('mouseleave', stopListeningAndSend);

        arcBtn.addEventListener('touchstart', startListening);
        arcBtn.addEventListener('touchend', stopListeningAndSend);

        // Envío POST a la API
        async function sendToJarvis(text, blob) {
            const formData = new FormData();
            formData.append('clave', accessKeyInput.value);
            formData.append('mensaje_texto', text);
            formData.append('modelo', modelSelect.value);

            if (blob) {
                formData.append('image_file', blob, 'screenshot.jpg');
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.texto) {
                    addMessage('jarvis', data.texto);

                    if (data.has_audio) {
                        const audio = new Audio('/api/audio?t=' + new Date().getTime());
                        audio.play();
                    }
                } else {
                    addMessage('jarvis', 'Error: No se recibió respuesta del servidor.');
                }
            } catch (err) {
                addMessage('jarvis', 'Error de conexión con el servidor JARVIS.');
            }
        }

        function addMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg msg-${sender}`;
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'msg-header';
            headerDiv.innerText = sender === 'user' ? 'OPERADOR' : 'J.A.R.V.I.S.';

            const contentDiv = document.createElement('div');
            contentDiv.innerText = text;

            msgDiv.appendChild(headerDiv);
            msgDiv.appendChild(contentDiv);

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
