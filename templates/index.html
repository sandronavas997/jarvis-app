<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // MARK COPILOT</title>
    <!-- Fuentes HUD Stark -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080305;
            --panel-bg: rgba(20, 6, 10, 0.85);
            --stark-gold: #ffb703;
            --stark-orange: #ff7700;
            --stark-red: #e63946;
            --crimson-dark: #66000e;
            --cyan-core: #00f3ff;
            --font-hud: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(230, 57, 70, 0.12) 0%, transparent 65%),
                linear-gradient(rgba(255, 183, 3, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 183, 3, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffe6e8;
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER HUD */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(180deg, rgba(30, 5, 10, 0.95) 0%, rgba(12, 3, 6, 0.9) 100%);
            border-bottom: 2px solid var(--stark-red);
            box-shadow: 0 4px 20px rgba(230, 57, 70, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .brand-title {
            font-family: var(--font-hud);
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--stark-gold);
            text-shadow: 0 0 10px var(--stark-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--stark-gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--stark-gold);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hud-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-input, .hud-select {
            background: rgba(255, 183, 3, 0.06);
            border: 1px solid var(--stark-gold);
            color: var(--stark-gold);
            font-family: var(--font-code);
            padding: 5px 10px;
            border-radius: 4px;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-stream {
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.3), rgba(255, 183, 3, 0.4));
            border: 1px solid var(--stark-gold);
            color: #ffffff;
            font-family: var(--font-hud);
            font-size: 0.7rem;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-stream:hover {
            background: var(--stark-gold);
            color: #000;
        }

        /* MAIN LAYOUT (FULL HEIGHT CHAT) */
        .main-container {
            display: flex;
            flex: 1;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
        }

        /* CHAT PANEL (IZQUIERDA - AMPLIO) */
        .chat-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--stark-red);
            border-radius: 8px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(102, 0, 14, 0.5);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 8px;
        }

        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--stark-red);
            border-radius: 3px;
        }

        .msg {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            align-self: flex-end;
            background: rgba(255, 183, 3, 0.15);
            border: 1px solid var(--stark-gold);
            color: #fff4d9;
            border-top-right-radius: 0;
        }

        .msg-jarvis {
            align-self: flex-start;
            background: rgba(230, 57, 70, 0.15);
            border: 1px solid var(--stark-red);
            color: #ffffff;
            border-top-left-radius: 0;
        }

        .msg-header {
            font-family: var(--font-hud);
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .msg-user .msg-header { color: var(--stark-gold); }
        .msg-jarvis .msg-header { color: var(--stark-red); }

        /* RIGHT PANEL: FEED + COMPACT ARC REACTOR */
        .hud-side-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-box {
            background: var(--panel-bg);
            border: 1px solid var(--stark-gold);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .preview-title {
            font-family: var(--font-hud);
            font-size: 0.7rem;
            color: var(--stark-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        video#screen-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid var(--stark-orange);
            border-radius: 4px;
            background: #000;
        }

        /* COMPACT ARC CONTROL PANEL */
        .reactor-card {
            background: var(--panel-bg);
            border: 1px solid var(--stark-red);
            border-radius: 8px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.15);
        }

        .arc-reactor {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, var(--stark-gold) 35%, var(--stark-orange) 60%, var(--crimson-dark) 100%);
            border: 2px solid var(--stark-gold);
            box-shadow: 0 0 20px var(--stark-orange), inset 0 0 10px var(--stark-gold);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .arc-reactor::before {
            content: '';
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px dashed var(--stark-gold);
            animation: spin 10s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .arc-reactor.active {
            background: radial-gradient(circle, #ffffff 0%, var(--cyan-core) 45%, var(--stark-red) 75%, #000000 100%);
            border-color: var(--cyan-core);
            box-shadow: 0 0 35px var(--cyan-core), inset 0 0 15px var(--cyan-core);
            transform: scale(1.05);
        }

        .arc-reactor.active::before { border-color: var(--cyan-core); animation-duration: 3s; }

        .arc-icon {
            width: 24px;
            height: 24px;
            fill: #110306;
        }

        .arc-reactor.active .arc-icon { fill: #ffffff; }

        .arc-status {
            font-family: var(--font-hud);
            font-size: 0.65rem;
            color: var(--stark-gold);
            letter-spacing: 1px;
            text-align: center;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancel {
            width: 100%;
            background: rgba(230, 57, 70, 0.2);
            border: 1px solid var(--stark-red);
            color: #ff808b;
            font-family: var(--font-hud);
            font-size: 0.65rem;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-cancel:hover {
            background: var(--stark-red);
            color: #ffffff;
            box-shadow: 0 0 10px var(--stark-red);
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="brand-title">
            <div class="status-dot"></div>
            J.A.R.V.I.S. <span style="font-size: 0.75rem; color: var(--stark-red);">// MARK COPILOT</span>
        </div>

        <div class="hud-controls">
            <input type="password" id="access-key" class="hud-input" placeholder="CLAVE DE ACCESO">
            <select id="model-select" class="hud-select">
                <option value="flash">GEMINI 3.6 FLASH</option>
                <option value="pro">GEMINI 3.6 PRO</option>
            </select>
            <button id="btn-bind-screen" class="btn-stream">🖥️ VINCULAR PANTALLA</button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="main-container">
        <!-- CHAT PANEL AMAPLIADO -->
        <div class="chat-panel">
            <div id="chat-messages" class="chat-messages">
                <div class="msg msg-jarvis">
                    <div class="msg-header">SYSTEM // ONLINE</div>
                    Sistemas listos, Señor. Vinculador activo. Presione la <b>BARRA ESPACIADORA</b> o el Reactor lateral para analizar la posición.
                </div>
            </div>
        </div>

        <!-- PANEL DERECHO COMPACTO -->
        <div class="hud-side-panel">
            <div class="preview-box">
                <div class="preview-title">📡 FEED PANTALLA EN VIVO</div>
                <video id="screen-preview" autoplay playsinline muted></video>
            </div>

            <!-- REACTOR + BOTÓN CANCELAR -->
            <div class="reactor-card">
                <div id="arc-btn" class="arc-reactor">
                    <svg class="arc-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>
                <div id="arc-status" class="arc-status">PRESIONA O MANTÉN ESPACIO</div>
                <button id="btn-cancel" class="btn-cancel">🛑 CANCELAR CONSULTA</button>
            </div>
        </div>
    </div>

    <canvas id="capture-canvas"></canvas>

    <script>
        const accessKeyInput = document.getElementById('access-key');
        const modelSelect = document.getElementById('model-select');
        const btnBindScreen = document.getElementById('btn-bind-screen');
        const screenPreview = document.getElementById('screen-preview');
        const arcBtn = document.getElementById('arc-btn');
        const arcStatus = document.getElementById('arc-status');
        const btnCancel = document.getElementById('btn-cancel');
        const chatMessages = document.getElementById('chat-messages');
        const captureCanvas = document.getElementById('capture-canvas');

        let screenStream = null;
        let recognition = null;
        let spokenTranscript = "";
        let isListening = false;
        let spacePressed = false;
        
        // Controladores globales de Aborto y Audio activo
        let currentAbortController = null;
        let currentAudio = null;

        // Cargar clave guardada
        accessKeyInput.value = localStorage.getItem('jarvis_key') || '';
        accessKeyInput.addEventListener('input', () => {
            localStorage.setItem('jarvis_key', accessKeyInput.value);
        });

        // Configuración de Reconocimiento de Voz Web
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let accumulated = "";
                for (let i = 0; i < event.results.length; i++) {
                    accumulated += event.results[i][0].transcript + " ";
                }
                spokenTranscript = accumulated.trim();
                if (spokenTranscript) {
                    arcStatus.innerText = `🎙️ "${spokenTranscript.slice(-25)}..."`;
                }
            };
        }

        // Vincular Captura de Pantalla
        btnBindScreen.addEventListener('click', async () => {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: false
                });
                screenPreview.srcObject = screenStream;
                btnBindScreen.innerText = "✓ VINCULADA";
                btnBindScreen.style.borderColor = "var(--stark-gold)";
            } catch (err) {
                alert("No se seleccionó ninguna pantalla.");
            }
        });

        // Cancelar consulta activa y audio
        function stopAllOperations() {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            arcStatus.innerText = "OPERACIÓN CANCELADA";
            arcStatus.style.color = "var(--stark-red)";
            setTimeout(() => {
                arcStatus.innerText = "PRESIONA O MANTÉN ESPACIO";
                arcStatus.style.color = "var(--stark-gold)";
            }, 1500);
        }

        btnCancel.addEventListener('click', stopAllOperations);

        // Eventos de Activación
        const startListening = (e) => {
            if (e) e.preventDefault();
            if (isListening) return;

            // Detener cualquier audio previo que esté sonando
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            isListening = true;
            spokenTranscript = "";

            arcBtn.classList.add('active');
            arcStatus.innerText = "ESCUCHANDO...";
            arcStatus.style.color = "var(--cyan-core)";

            if (recognition) {
                try { recognition.start(); } catch(e){}
            }
        };

        const stopListeningAndSend = async (e) => {
            if (e) e.preventDefault();
            if (!isListening) return;
            isListening = false;

            arcBtn.classList.remove('active');
            arcStatus.innerText = "PROCESANDO...";
            arcStatus.style.color = "var(--stark-gold)";

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            // Capturar la imagen directamente desde el reproductor de video en vivo
            let imageBlob = null;
            if (screenPreview.videoWidth > 0 && screenPreview.videoHeight > 0) {
                captureCanvas.width = screenPreview.videoWidth;
                captureCanvas.height = screenPreview.videoHeight;
                const ctx = captureCanvas.getContext('2d');
                ctx.drawImage(screenPreview, 0, 0, captureCanvas.width, captureCanvas.height);
                imageBlob = await new Promise(resolve => captureCanvas.toBlob(resolve, 'image/jpeg', 0.85));
            }

            const promptText = spokenTranscript || "Analice la posición actual y la acción del precio en esta captura.";
            addMessage('user', promptText);

            await sendToJarvis(promptText, imageBlob);

            arcStatus.innerText = "PRESIONA O MANTÉN ESPACIO";
        };

        // Escuchadores Mouse/Touch
        arcBtn.addEventListener('mousedown', startListening);
        arcBtn.addEventListener('mouseup', stopListeningAndSend);

        // Escuchadores Barra Espaciadora
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
                e.preventDefault();
                if (e.repeat || spacePressed) return;
                spacePressed = true;
                startListening(e);
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
                e.preventDefault();
                if (!spacePressed) return;
                spacePressed = false;
                stopListeningAndSend(e);
            }
        });

        // Envío POST a la API con soporte para AbortController
        async function sendToJarvis(text, blob) {
            // Cancelar solicitud en vuelo previa si existía
            if (currentAbortController) {
                currentAbortController.abort();
            }
            currentAbortController = new AbortController();

            const formData = new FormData();
            formData.append('clave', accessKeyInput.value);
            formData.append('mensaje_texto', text);
            formData.append('modelo', modelSelect.value);

            if (blob) {
                formData.append('image_file', blob, 'screenshot.jpg');
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData,
                    signal: currentAbortController.signal
                });

                const data = await response.json();

                if (data.texto) {
                    addMessage('jarvis', data.texto);

                    if (data.has_audio) {
                        if (currentAudio) {
                            currentAudio.pause();
                        }
                        currentAudio = new Audio('/api/audio?t=' + new Date().getTime());
                        currentAudio.play();
                    }
                } else {
                    addMessage('jarvis', 'Error: No se recibió respuesta del servidor.');
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log('Consulta abortada por el usuario.');
                } else {
                    addMessage('jarvis', 'Error de conexión con el servidor JARVIS.');
                }
            } finally {
                currentAbortController = null;
            }
        }

        function addMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg msg-${sender}`;
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'msg-header';
            headerDiv.innerText = sender === 'user' ? 'OPERADOR' : 'J.A.R.V.I.S.';

            const contentDiv = document.createElement('div');
            contentDiv.innerText = text;

            msgDiv.appendChild(headerDiv);
            msgDiv.appendChild(contentDiv);

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
